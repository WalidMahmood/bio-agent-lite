# Frozen analysis thresholds (Master #12, #29). LLM must NOT invent these.
differential_expression:
  padj_threshold: 0.05
  log2fc_threshold: 1.0  # |log2FC| >= 1 for "strong" calls; significance still by padj
  low_count_filter: 10   # min total counts across samples (pydeseq2 default)
  top_k: [10, 25, 50]

enrichment:
  fdr_threshold: 0.05
  min_gene_set: 10
  max_gene_set: 500
  sources: ["GO_BP", "Reactome"]  # via gseapy (Python) until R/clusterProfiler available

evidence:
  min_relevance: 0.5
  top_n_per_claim: 3

critic:
  max_correction_iterations: 2
  fail_on: ["invented_gene", "padj_confusion", "wrong_direction", "wrong_comparison"]
